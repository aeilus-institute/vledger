plugins {
    id 'com.android.application'
}

android {
    namespace 'institute.aeilus.vledger.pilot'
    compileSdk 35

    defaultConfig {
        applicationId 'institute.aeilus.vledger.pilot'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-pilot'
    }

    signingConfigs {
        pilot {
            // the keystore and its password stay outside the repository (see BUILD.md)
            storeFile file(System.getenv('VW_KEYSTORE') ?: '../secrets/pilot.p12')
            storePassword System.getenv('VW_KEYSTORE_PASSWORD')
            keyAlias 'vledger-pilot'
            keyPassword System.getenv('VW_KEYSTORE_PASSWORD')
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.pilot
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
