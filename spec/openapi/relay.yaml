openapi: 3.1.0
info:
  title: aevri.vledger relay
  version: 1.0.0-d4
  summary: Passes encrypted messages between wallets and keeps nothing (SPEC section 11).
  license: { name: MIT, identifier: MIT }
  description: |
    A relay holds a message only until the addressed wallet picks it up, and never longer than 14 days. It cannot
    read messages (they are encrypted to the recipient's exchange key), does not log content, and keeps only counts.
    Senders may be anonymous. A relay MAY limit message size and rate per sender address or network.
servers:
  - url: https://aeilus.institute/api/v1/vledger/relay
    description: ÆVRI relay
  - url: http://127.0.0.1:8793/v1/relay
    description: Reference relay for tests (spec/tools/provider_server.py)
paths:
  /policy:
    get:
      summary: The relay's own storage policy, shown by wallets before sending
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                type: object
                required: [maxHoldDays, logsContent, maxBytes]
                properties:
                  maxHoldDays: { type: integer, maximum: 14 }
                  logsContent: { const: false }
                  maxBytes: { type: integer }
  /messages:
    post:
      summary: Hand over a message for its `to` address
      requestBody: { required: true, content: { application/json: { schema: { $ref: 'https://aeilus.institute/schema/vledger/1/message.schema.json' } } } }
      responses:
        '202': { description: Accepted for delivery }
        '413': { description: Too large }
        '429': { description: Too many messages }
  /challenge:
    get:
      summary: One-time challenge (5 minutes) for an address owner
      responses:
        '200': { description: Challenge, content: { application/json: { schema: { type: object, properties: { challenge: { type: string }, expiresAt: { type: string } } } } } }
  /inbox/{address}:
    get:
      summary: Messages waiting for this address. Fetching deletes them from the relay
      parameters:
        - { name: address, in: path, required: true, schema: { type: string } }
        - { name: X-Vledger-Challenge, in: header, required: true, schema: { type: string } }
        - { name: X-Vledger-Proof, in: header, required: true, description: 'base64url Ed25519 signature of the challenge by the address key', schema: { type: string } }
      responses:
        '200': { description: Messages, content: { application/json: { schema: { type: array, items: { $ref: 'https://aeilus.institute/schema/vledger/1/message.schema.json' } } } } }
        '403': { description: Proof does not match the address }
  /cards/{address}:
    parameters: [ { name: address, in: path, required: true, schema: { type: string } } ]
    get:
      summary: The card a holder chose to publish here (optional directory)
      responses:
        '200': { description: Card, content: { application/json: { schema: { $ref: 'https://aeilus.institute/schema/vledger/1/card.schema.json' } } } }
        '404': { description: Not published }
    put:
      summary: Publish or replace one's own card. The relay checks the signature and that the card's address is the path address
      requestBody: { required: true, content: { application/json: { schema: { $ref: 'https://aeilus.institute/schema/vledger/1/card.schema.json' } } } }
      responses:
        '204': { description: Published }
        '422': { description: Signature or address does not match }
    delete:
      summary: Withdraw the card (wallet proof headers as for the inbox)
      responses:
        '204': { description: Removed }
